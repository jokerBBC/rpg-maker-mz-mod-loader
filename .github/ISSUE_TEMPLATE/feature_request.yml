name: 功能建议
description: 新功能、体验改进或文档相关建议
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出想法。不必实现细节很完整，说清楚「想解决什么问题」即可。

  - type: textarea
    id: problem
    attributes:
      label: 问题或动机
      description: 当前哪里不方便、缺什么能力？
      placeholder: |
        例如：批量启用 Mod 时希望…

  - type: textarea
    id: solution
    attributes:
      label: 期望的功能或改进
      description: 你理想中的做法（可简略）
      placeholder: |
        例如：增加一个按钮可以…

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
      description: 是否用过其他工具或临时办法？
      placeholder: |
        例如：目前只能手动改 mod_config.json…
